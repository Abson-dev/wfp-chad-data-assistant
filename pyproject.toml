[project]
name = "wfp-chad-data-assistant"
version = "0.4.0"
description = "AI assistant for the merged WFP Chad resilience surveys: how the data were merged, what is wrong or fixed in them, and what they show."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning"]

[tool.ruff]
line-length = 160
extend-exclude = ["web/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Scripts put the repository on sys.path before importing the package.
per-file-ignores = { "ask.py" = ["E402"], "wfp_cli.py" = ["E402"], "build_agent_data.py" = ["E402"], "web/app.py" = ["E402"], "evals/*.py" = ["E402"] }
