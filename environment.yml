# Conda environment for the WFP Chad data assistant (the same packages as the ENSA assistant's ensa-agent, which run_web.bat also accepts).
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
name: wfp-agent
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas=2.2.2
  - numpy=2.2.6
  - pytest=8.2.2
  - pip
  - pip:
      - anthropic==2.3.0
      - fastapi==0.115.0    # web app (web)
      - uvicorn==0.30.6
      - truststore==0.10.5
      - httpx==0.27.2       # tests of the web app
      - playwright==1.48.0  # tests of the browser client, with the Chrome already on the machine
      - ruff==0.6.9
